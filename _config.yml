# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

title: Jeongin Park
description: >- # this means to ignore newlines until "baseurl:"
  Jeongin Park
baseurl: "/" # the subpath of the site
url: "https://jeonginp.github.io" # the base hostname & protocol for the site
og_image: /assets/img/profile-pic.jpg
google_analytics: "G-MG9Q26EVD3"

footer:
  show_powered_by: true
  contact:
    - type: email
      name: Email
      value: parkjeong02@gmail.com
  follow:    
    - type: github
      name: GitHub
      link: http://github.com/jeonginp
    
# Build settings
markdown: kramdown
sass:
    style: :compressed
plugins:
  - jekyll-feed

include:
  - _pages
# Excluded items
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - feed.xml
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Used for defeating caching
version: 1
